<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RecFlow</title>
  <link rel="stylesheet" href="float.css">
</head>
<body>
  <div id="float-bar">
    <div id="float-left">
      <span class="float-dot" id="float-dot"></span>
      <span id="float-timer">00:00</span>
    </div>
    <div id="float-controls">
      <!-- Pause / Resume -->
      <button id="float-pause" title="Pause">
        <svg id="icon-pause" width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
          <rect x="5" y="3" width="5" height="18" rx="1"/>
          <rect x="14" y="3" width="5" height="18" rx="1"/>
        </svg>
        <svg id="icon-resume" class="hidden" width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21"/>
        </svg>
      </button>
      <!-- Stop -->
      <button id="float-stop" title="Stop recording">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
        </svg>
      </button>
      <!-- Discard -->
      <button id="float-discard" title="Discard recording">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14H6L5 6"/>
          <path d="M10 11v6M14 11v6"/>
          <path d="M9 6V4h6v2"/>
        </svg>
      </button>
    </div>
  </div>
  <script src="float.js"></script>
</body>
</html>
