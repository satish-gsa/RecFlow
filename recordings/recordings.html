<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Recordings — RecFlow</title>
  <link rel="stylesheet" href="recordings.css" />
</head>
<body>

  <header class="header">
    <div class="header-left">
      <div class="logo-dot"></div>
      <h1 class="header-title">My Recordings</h1>
    </div>
    <div class="header-right">
      <span id="recording-count" class="count-badge"></span>
      <button id="btn-new" class="btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="4" fill="#fff"/>
        </svg>
        New Recording
      </button>
    </div>
  </header>

  <!-- Recovery banner -->
  <div id="recovery-banner" class="recovery-banner hidden">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="#ff9800" stroke-width="2">
      <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/>
      <line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    <span id="recovery-text">Recordings recovered after a crash.</span>
    <button id="btn-dismiss-recovery" class="btn-ghost-sm">Dismiss</button>
  </div>

  <!-- Empty state -->
  <div id="empty-state" class="empty-state hidden">
    <div class="empty-icon">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <circle cx="12" cy="10" r="3"/>
        <polyline points="8 21 12 17 16 21"/>
      </svg>
    </div>
    <h2>No recordings yet</h2>
    <p>Start recording your screen, camera, or both.</p>
    <button id="btn-start-empty" class="btn-primary">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="12" cy="12" r="10"/>
        <circle cx="12" cy="12" r="4" fill="#fff"/>
      </svg>
      Start Recording
    </button>
  </div>

  <!-- Recordings grid -->
  <main id="recordings-grid" class="recordings-grid hidden"></main>

  <!-- Loading state -->
  <div id="loading-state" class="loading-state">
    <div class="spinner"></div>
  </div>

  <!-- Video playback modal -->
  <div id="modal-play" class="modal hidden">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-content">
      <button id="btn-close-modal" class="modal-close" title="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <video id="modal-video" class="modal-video" controls></video>
      <div class="modal-actions">
        <p id="modal-title" class="modal-title"></p>
        <button id="btn-modal-download" class="btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Download
        </button>
      </div>
    </div>
  </div>

  <!-- Delete confirm dialog -->
  <div id="modal-delete" class="modal hidden">
    <div class="modal-backdrop" id="delete-backdrop"></div>
    <div class="modal-content modal-confirm">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none"
           stroke="#e84040" stroke-width="1.5">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
        <path d="M10 11v6"/><path d="M14 11v6"/>
        <path d="M9 6V4h6v2"/>
      </svg>
      <h3>Delete Recording?</h3>
      <p id="delete-name" class="delete-name"></p>
      <p class="delete-warning">This action cannot be undone.</p>
      <div class="confirm-actions">
        <button id="btn-confirm-delete" class="btn-danger">Delete</button>
        <button id="btn-cancel-delete" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="../utils/db.js"></script>
  <script src="recordings.js"></script>
</body>
</html>
